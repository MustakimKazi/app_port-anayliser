version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portwatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portwatch}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portwatch_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3100
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/portwatch?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-portwatch-2026-very-secure}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leadowserver.local}
      SCANNER_MODE: ${SCANNER_MODE:-host}
      SCAN_INTERVAL_SEC: ${SCAN_INTERVAL_SEC:-30}
      TCP_TIMEOUT_MS: ${TCP_TIMEOUT_MS:-3000}
      SLOW_THRESHOLD_MS: ${SLOW_THRESHOLD_MS:-1500}
      CONCURRENCY_LIMIT: ${CONCURRENCY_LIMIT:-20}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    ports:
      - "${API_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portwatch_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3150}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
