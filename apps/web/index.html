<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortWatch — Server Port & Route Monitoring Dashboard</title>
    <meta name="description" content="Production-grade real-time server port, route, and upstream monitoring dashboard for Linux and Nginx servers." />
    <meta name="theme-color" content="" id="meta-theme-color" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
          var meta = document.getElementById('meta-theme-color');
          if (meta && bg) meta.setAttribute('content', bg);
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-text antialiased font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
